server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: Orchid

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jmx:
    enabled: false
