spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${jwt.secret}
    access-expires-minutes: 60
    refresh-expires-days: 7